<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Control Tower</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="app-shell">
    <header class="brand-header">
      <div class="brand-lockup">
        <img id="mufg-logo" src="/images/mufg-logo.png" alt="MUFG" width="146" height="35" hidden>
        <strong id="organization">Customer</strong>
        <span id="application-name">AI Control Tower</span>
      </div>
      <span id="mode-badge" class="badge">READ-ONLY FOUNDATION</span>
    </header>
    <nav class="primary-nav" aria-label="Sections">
      <a href="#dashboard" aria-current="page">Dashboard</a>
      <a href="#solutions">Solutions</a>
      <a href="#agent">Agent detail</a>
      <a href="#controls">Controls</a>
    </nav>
    <main id="content" tabindex="-1">
      <div class="toolbar">
        <span id="identity">Loading configuration...</span>
        <div class="toolbar-actions">
          <label class="preview-switch"><input id="preview" type="checkbox"> Illustrative preview</label>
          <button id="refresh" type="button">Refresh connection</button>
        </div>
      </div>
      <div id="error" role="alert" hidden></div>
      <div id="mode-notice" class="notice" role="status"></div>
      <div class="page-heading">
        <div><h1 id="page-title">Dashboard</h1><p id="page-context">Executive overview</p></div>
        <a id="powerbi-open" class="button" target="_blank" rel="noopener noreferrer" hidden>Open in Power BI</a>
      </div>
      <section id="dashboard" aria-labelledby="page-title">
        <div id="report"></div>
        <div id="dashboard-cards" class="metric-grid"></div>
        <div id="dashboard-summary" class="summary-panel"></div>
      </section>
      <section id="solutions" hidden aria-labelledby="page-title">
        <div class="section-heading">
          <label class="search-label">Search solutions<input id="search" type="search" placeholder="Search solutions..." autocomplete="off"></label>
          <span id="count" class="muted"></span>
        </div>
        <div id="solution-list" class="solution-list"></div>
      </section>
      <section id="agent" hidden aria-labelledby="page-title">
        <label class="selection-label">Solution / agent context<select id="agent-select"></select></label>
        <p id="agent-context" class="muted"></p>
        <div id="agent-cards" class="metric-grid agent-grid"></div>
        <div class="panel timeline-panel">
          <div class="section-heading"><h2>Execution timeline</h2><span class="muted">24-hour view</span></div>
          <div id="timeline"></div>
        </div>
        <div id="components" class="panel"></div>
      </section>
      <section id="controls" hidden aria-labelledby="page-title">
        <label class="selection-label">Select solution<select id="control-select"></select></label>
        <div id="control-content"></div>
      </section>
      <footer><span id="disclaimer"></span><span>Runtime control integration is not included in this foundation.</span></footer>
    </main>
  </div>
</body>
</html>
